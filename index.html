<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yimo-Ye | 绝区零音乐数据库</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --text-color: #ffffff;
            --accent-color: #ffaa00; /* 绝区零标志性黄色 */
            --card-bg: #1f2833;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid var(--accent-color);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: var(--accent-color);
            letter-spacing: 2px;
        }
        p {
            color: #c5a1ff;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            background: #2ecc71;
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: var(--accent-color);
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #ffc44d;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 170, 0, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="status-badge">🌐 站点已成功上线</div>
    <h1>Zenless Zone Zero</h1>
    <p>绝区零音乐数据库 (zzz-music-db) 正在秘密建设中...</p>
    <!-- 后续可以将此处链接修改为你真正的音乐列表页 -->
    <a href="https://github.com" target="_blank" class="btn">关注 GitHub 项目进度</a>
</div>

</body>
</html>
